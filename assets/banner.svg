<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="url(#grid-fade)" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .pulse-circle { animation: pulse 3s ease-in-out infinite; }
      .wave-path { animation: float 6s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 0.4; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)" rx="16" />
  <rect width="1200" height="320" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Currency Graph Waves -->
  <g filter="url(#glow)">
    <path d="M 50 220 Q 200 100 350 180 T 650 140 T 950 200 T 1150 100" fill="none" stroke="url(#accent)" stroke-width="4" class="wave-path" />
    <path d="M 50 240 Q 200 160 350 210 T 650 180 T 950 230 T 1150 140" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />
  </g>

  <!-- Dynamic Animated Glowing Data Points -->
  <circle cx="350" cy="180" r="7" fill="#38bdf8" class="pulse-circle" />
  <circle cx="650" cy="140" r="7" fill="#818cf8" class="pulse-circle" />
  <circle cx="950" cy="200" r="7" fill="#c084fc" class="pulse-circle" />

  <!-- Currency Symbols Badges -->
  <g transform="translate(850, 40)" opacity="0.15">
    <text font-family="sans-serif" font-size="90" font-weight="bold" fill="#ffffff">¥ $ € £</text>
  </g>

  <!-- Content Header -->
  <g transform="translate(60, 110)">
    <rect x="0" y="-35" width="285" height="32" rx="16" fill="#312e81" fill-opacity="0.6" stroke="#6366f1" stroke-width="1" />
    <text x="14" y="-14" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#a5b4fc">💱 CURRENCY HEDGING &amp; TREASURY</text>
    
    <text x="0" y="35" class="title">Awesome Foreign Exchange Risk Management</text>
    <text x="0" y="75" class="subtitle">Curated Open-Source Tools, Quantitative Risk Analytics &amp; Enterprise FX Platforms 📈🛡️</text>
  </g>

  <!-- Decorative Bottom Accent Line -->
  <rect x="0" y="312" width="1200" height="8" fill="url(#accent)" rx="4" />
</svg>
